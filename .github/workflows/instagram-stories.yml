name: Instagram stories sync
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
concurrency:
  group: screensync-instagram-stories
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ScreenSync story sync
        env:
          SCREENSYNC_URL: ${{ secrets.SCREENSYNC_URL }}
          JOB_SECRET: ${{ secrets.INSTAGRAM_SCHEDULER_SECRET }}
        run: |
          test -n "$SCREENSYNC_URL" && test -n "$JOB_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 \
            -X POST "$SCREENSYNC_URL/api/instagram/jobs/stories" \
            -H "x-screensync-job-secret: $JOB_SECRET"
